# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2ca442acb18e707f5019fe4b6e510cbf"
name = "Product Bundler"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_cart_transforms is required for the cart.transform.run function target.
# write_products lets the bundle editor (bundle-admin-action) read products and
# write the $app / bundle_components metafield.
scopes = "write_cart_transforms,write_products"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[sidekick]
extensions_summary = "Sell bundled products that expand into their component variants in the cart"
